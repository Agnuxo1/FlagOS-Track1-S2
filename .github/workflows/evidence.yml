name: Recorded evidence
on: [push, pull_request]
jobs:
  raw-timing-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/summarize_gate.py
      - run: python scripts/summarize_operators.py
      - run: python scripts/verify_task177.py
      - run: python -m unittest discover -s scripts -p test_task177_archive.py
      - run: git diff --exit-code -- results/operators-20261028/SUMMARY.md
      - run: git diff --exit-code -- results/gate-20261028/SUMMARY.md
